    --lead: #8FA9F0; --lead-soft: #1B2745; --manage: #5CCBB7; --manage-soft: #14332D; --coach: #E39BD0; --coach-soft: #3A1B33;
    --warn: #EBA561; --warn-soft: #33261A; --crit: #F0877F; --crit-soft: #3A1A1A; color-scheme: dark;
  }
}

.flowbar {

.brand { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip.disc span { flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; }

.rep-row .v { white-space: pre-wrap; overflow-wrap: anywhere; }
.sub { font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.chips.seg .chip span { min-height: 42px; padding: 6px 14px; font-size: 15px; }

[data-k="Green"] { --kc: var(--manage); --ks: var(--manage-soft); }

.ref p { margin: 0; }
.ref .tag { font-family: var(--display); font-size: 17px; color: var(--coach); }
.card.lazy details.entry { background: var(--field); }
.pill.who { background: var(--surface); color: var(--fg); border-color: var(--fg); }

.pill.kpi { background: var(--ks); color: var(--kc); border-color: var(--kc); }

.chips.traffic .chip:nth-child(1) input:checked + span { background: var(--manage-soft); border-color: var(--manage); color: var(--manage); }

.chips.traffic .chip:nth-child(3) input:checked + span { background: var(--crit-soft); border-color: var(--crit); color: var(--crit); }
@media print { body { background: #fff; color: #000; } .noprint, .toast { display: none !important; } .card { break-inside: avoid; border-color: #999; } .wrap { padding-block: 0; } }
@media (prefers-reduced-motion: no-preference) { .pause .bar i { transition: width 1s linear; } .progress .bar i { transition: width .25s ease; } }
</style>

<script>
(function () {

  var LEVELS = {
    'On Plan': { cls: '', act: 'Recognize what is working and keep the cadence.' },
    'Coach Only': { cls: 'live', act: 'No plan change. The franchisee owns a corrective action; re-check at the next visit.' },
    'Tactical Adjustment': { cls: 'hot', act: 'Revise the initiative and its actions. The strategic priority and the KPI target stay intact. Document it on the variance report.' },
    'Strategic Adjustment': { cls: 'hot', act: 'Reopen the strategic priority on the Strategic Plan. Ask whether the target was unrealistic or execution is failing. Consider an off-cycle visit.' },
    'Plan Reset': { cls: 'hot', act: 'Full review of the Strategic and Business Plans before the next visit. Treat it as an off-cycle Expectation Meeting and involve franchise leadership.' }
  };
  function lmcLevel(L) {

  }

    'Franchisees will not adopt it': [
      { k: 'r0', q: 'What will owners have to stop doing for this to work, and who has said yes?' },
      { k: 'r1', q: 'Which franchisee will push back first, and what do they lose?' }
    ],
    'Revenue or royalty takes a hit': [

    'Territory or lead conflict': [

    'AVP or staff capacity': [

      { k: 'r1', q: 'What happens to the franchisees on that AVP\'s visit schedule meanwhile?' }
    ]
  };
  /* Examples change with the Leadership / AVP switch. */
  var EX = {
    Leadership: {
      Lead: { ph: 'Example: Should we offer the lead-share program to TEGG franchisees in two more regions?', act: 'Example: Share the new direction with every franchisee on the next owners call.' },
      Manage: { ph: 'Example: Should we change how we track franchisee revenue reporting across the system?', act: 'Example: Pull this quarter\'s scorecards and review the Reds with the AVPs by Friday.' },
      Coach: { ph: 'Example: Should I move an AVP onto our largest TEGG territories?', act: 'Example: Hold a 30-minute feedback conversation with the AVP this week.' },
      who: 'Example: Linc Service owners in the Southeast', why: 'Example: Two franchisees asked for it at the advisory council.', alt: 'Example: Pilot with two franchisees first.'

  function ex() { return EX[state.role] || EX.Leadership; }

  function lazyRef(title) {
    var b = el('div', { class: 'body ref' });
    b.append(el('p', { class: 'tag' }, '"Work smart" is advice. Laziness is the motive that makes people follow it.'),

        if (D.lazy.same === SAME[2]) warnBox.append(el('div', { class: 'banner warn' }, el('span', { class: 'lab' }, 'Lazy about the how, never the what'), el('span', {}, 'If the result suffers, it is cutting corners, not laziness. Keep it as an option, but it should not win.')));
        else if (D.lazy.how.trim() && D.lazy.same === SAME[0]) warnBox.append(el('p', { class: 'hint' }, 'This path is added to your options, so you can score it on the next screen.'));
      };
      var lzChips = el('div', { class: 'chips col', role: 'radiogroup' }), lzName = gid('z');
      LAZY.forEach(function (x, i) {
        var inp = el('input', { type: 'radio', name: lzName, id: lzName + i, value: x.k });
        if (D.lazy.path === x.k) inp.checked = true;
        inp.addEventListener('change', function () { D.lazy.path = x.k; saveDraft(); drawLazy(); });
        lzChips.append(el('label', { class: 'chip disc', for: lzName + i, 'data-d': 'Coach' }, inp, el('span', {}, el('strong', {}, x.k + (x.t ? ' (' + x.t + ')' : '')), el('small', {}, x.d))));
      });
      main.append(el('div', { class: 'card stack tight lazy' }, el('span', { class: 'eyebrow' }, 'The Laziness Theory'),
        el('h3', {}, 'Is there a less-effort way to the same result?'),
        el('p', { class: 'hint' }, 'Effort is not the same as value. Before adding work, ask what you could stop, automate, delegate or simplify.'), lazyRef('What is the Laziness Theory?'), lzChips, lzBox));
      drawLazy();
      addTool(main, 'missing', D);
    } else if (step === 'matrix') {
      var mo = matrixOpts(D);
      main.append(el('h2', {}, 'How do the options compare?'),
        el('p', { class: 'hint' }, 'Choose what matters most, say how much (1 to 5), then score every option from 1 (weak) to 5 (strong). You can skip this.'));
      if (mo.length < 2) {
        main.append(el('div', { class: 'banner' }, el('span', { class: 'lab' }, 'Nothing to compare yet'), el('span', {}, 'Go back and name at least one other option.')));
      } else {
        var resBox = el('div', {}), rowsBox = el('div', { class: 'stack tight' });
        var upd = function () { resBox.replaceChildren(matrixResultNode(D)); };
        var numSel = function (val, cb) {
          var sl = el('select', {});
          [1, 2, 3, 4, 5].forEach(function (n) { sl.append(el('option', { value: String(n) }, String(n))); });
          sl.value = String(val);
          sl.addEventListener('change', function () { cb(+sl.value); saveDraft(); upd(); });
          return sl;
        };
        var drawRows = function () {
          rowsBox.replaceChildren();
          D.matrix.crit.forEach(function (cr, k) {
            var grid = el('div', { class: 'mgrid', style: 'grid-template-columns:repeat(' + (mo.length + 1) + ',1fr)' });
            grid.append(el('div', { class: 'field' }, el('span', { class: 'lab' }, 'Matters'), numSel(cr.w, function (v) { cr.w = v; })));
            mo.forEach(function (name, j) {
              grid.append(el('div', { class: 'field' }, el('span', { class: 'lab', title: name }, short(name, 9)), numSel(cr.s[j], function (v) { cr.s[j] = v; })));
            });
            rowsBox.append(el('div', { class: 'card stack tight' },
              textField('Criterion ' + (k + 1), cr.name, function (v) { cr.name = v; saveDraft(); upd(); }, 'Example: Cost', 'input').node, grid));
          });
        };
        var sug = el('div', { class: 'actions' });
        ['Franchisee impact', 'Revenue impact', 'Effort', 'Brand standards', 'AVP time', 'Cost', 'Risk'].forEach(function (nm) {
          var bb = el('button', { class: 'btn small ghost', type: 'button' }, nm);
          bb.addEventListener('click', function () {
            var empty = D.matrix.crit.filter(function (c) { return !c.name.trim(); })[0];
            if (empty) empty.name = nm;
            else if (D.matrix.crit.length < 5) D.matrix.crit.push({ name: nm, w: 3, s: [3, 3, 3, 3] });
            else { toast('Five criteria is plenty.'); return; }
            saveDraft(); drawRows(); upd();
          });
          sug.append(bb);
        });
        main.append(el('span', { class: 'lab' }, 'Tap to add a criterion'), sug, rowsBox, resBox);
        drawRows(); upd();
      }
    } else if (step.charAt(0) === 'q') {
      var qi = +step.slice(1), Q = qsFor(D)[qi], A = D.answers[qi];
      main.append(el('span', { class: 'eyebrow' }, D.discipline + (flow.quick ? ' / quick check / ' : ' / question ' + (qi + 1) + ' of 5 / ') + Q.t), el('h2', {}, Q.q),
        el('p', { class: 'hint' }, Q.h), qi === 0 ? el('p', { class: 'hint' }, STOIC) : null, qi === 0 ? el('p', { class: 'hint' }, 'Tip: tap Speak above the box, then use the microphone key on your keyboard if asked.') : null);
      if (Q.c) main.append(chipField('Pick one', Q.c, A.pick, function (v) { A.pick = v; saveDraft(); }));
      main.append(textField(Q.c ? 'Explain it' : 'Your answer', A.a, function (v) { A.a = v; saveDraft(); }, Q.ph).node);
      var chalBox = el('div', { class: 'stack tight' });
      var chalUpdate = function () {
        chalBox.replaceChildren();
        if (A.conf === CONF[1]) chalBox.append(textField('Challenge it: what would prove this wrong?', A.chal, function (v) { A.chal = v; saveDraft(); }, 'Example: If two of the five owners we ask say no.').node);
        else if (A.conf === CONF[2]) chalBox.append(textField('Who could verify this, and by when?', A.chal, function (v) { A.chal = v; saveDraft(); }, 'Example: Ask the AVP who covers that PMA by Friday.').node);
      };
      main.append(el('div', { class: 'field' }, el('span', { class: 'lab' }, 'How sure are you?'),
        chipGroup(CONF, A.conf, function (v) { if (A.conf !== v) A.chal = ''; A.conf = v; saveDraft(); chalUpdate(); })), chalBox);
      chalUpdate();
    } else if (step === 'who') {
      main.append(el('h2', {}, 'Who is affected?'),
        el('p', { class: 'hint' }, 'People, teams or customers touched by the decision itself, and by how it turns out. Start with the people you would not want to surprise.'));
      D.who.forEach(function (w, k) {
        main.append(el('div', { class: 'card stack tight' },
          textField('Who (person or group) ' + (k + 1), w.name, function (v) { w.name = v; saveDraft(); }, X.who, 'input').node,
          textField('How does the decision affect them?', w.dec, function (v) { w.dec = v; saveDraft(); }, 'Example: They must change how they work renewals.').node,
          textField('How does the outcome affect them?', w.out, function (v) { w.out = v; saveDraft(); }, 'Example: If it works, steadier recurring revenue. If not, lost goodwill.').node));
      });
      if (D.who.length < 5) {
        var addw = el('button', { class: 'btn ghost small', type: 'button' }, 'Add another person or group');
        addw.addEventListener('click', function () { D.who.push({ name: '', dec: '', out: '' }); saveDraft(); renderFlow(); });
        main.append(addw);
      }
      addTool(main, 'challenge', D);
    } else if (step === 'control') {
      main.append(el('h2', {}, 'What is in our control?'), el('p', { class: 'hint' }, 'Put your effort into the first two. Prepare calmly for the third.'));
      main.append(textField('Fully in our control', D.control.mine, function (v) { D.control.mine = v; saveDraft(); }, 'Example: Our message, our timeline, which AVP we assign.').node,
        textField('We can influence, but not decide', D.control.influence, function (v) { D.control.influence = v; saveDraft(); }, 'Example: Whether owners take part, how their customers react.').node,
        textField('Outside our control', D.control.outside, function (v) { D.control.outside = v; saveDraft(); }, 'Example: Competitor pricing, construction and facility spending.').node);
    } else if (step === 'blind') {
      if (pausing) {
        var count = el('div', { class: 'count', 'aria-live': 'polite' }, '5');
        var pbar = el('i', {});
        main.append(el('div', { class: 'card pause' }, el('span', { class: 'lab' }, 'Pause'), count,
          el('p', {}, 'You have answered what you could see. Now look for what you cannot.'), el('div', { class: 'bar' }, pbar)));
        var left = 5;
        setTimeout(function () { pbar.style.width = '100%'; }, 30);
        timer = setInterval(function () {
          left -= 1;
          count.textContent = String(Math.max(left, 0));
          if (left <= 0) { clearInterval(timer); flow.paused = true; saveDraft(); renderFlow(); }
        }, 1000);
      } else {
        main.append(el('h2', {}, 'What might we not be considering?'),
          el('p', { class: 'hint' }, 'A short answer is fine. "I do not know yet" is a useful answer.'));
        main.append(textField('Picture it six months from now. It failed. What is the most likely reason?', D.blind.fail, function (v) { D.blind.fail = v; saveDraft(); }, 'Example: The owner agreed at the visit but never changed the routine.').node);
        main.append(textField('What information are we missing, and who could tell us?', D.blind.missing, function (v) { D.blind.missing = v; saveDraft(); }, 'Example: We have not asked the GM who would run it day to day.').node,
          textField('What would someone who disagrees with us say?', D.blind.oppose, function (v) { D.blind.oppose = v; saveDraft(); }, 'Example: It is too much change in peak HVAC season.').node,
          textField('What could change in the next six months that we are not planning for?', D.blind.change, function (v) { D.blind.change = v; saveDraft(); }, 'Example: An equipment price rise, a key technician leaving.').node);
        var rBox = el('div', { class: 'stack tight' });
        var drawRisk = function () {
          rBox.replaceChildren();
          var RQ = RISKS[D.blind.risk];
          if (!RQ) return;
          RQ.forEach(function (x) { rBox.append(textField(x.q, D.blind[x.k], function (v) { D.blind[x.k] = v; saveDraft(); }, '').node); });
        };
        main.append(el('div', { class: 'card stack tight' }, el('h3', {}, 'Which ABMFG risk worries you most?'),
          chipGroup(Object.keys(RISKS).concat(['None of these']), D.blind.risk, function (v) { D.blind.risk = v; D.blind.r0 = ''; D.blind.r1 = ''; saveDraft(); drawRisk(); }, 'col'), rBox));
        drawRisk();
      }
    } else if (step === 'how') {
      main.append(el('span', { class: 'eyebrow' }, PH.How), el('h2', {}, 'How will we do it?'),
        el('p', { class: 'hint' }, 'Plain steps, and how you will know it is working.'));
      main.append(textField('The plan in a few steps', D.how.plan, function (v) { D.how.plan = v; saveDraft(); }, 'Example: 1. Pilot with two franchisees. 2. Review at the next visit. 3. Roll out system-wide.').node,
        textField('How will we know it is working?', D.how.measure, function (v) { D.how.measure = v; saveDraft(); }, 'Example: PM renewal rate back to 90% within two quarters.').node,
        textField('What and who do we need?', D.how.needs, function (v) { D.how.needs = v; saveDraft(); }, 'Example: The AVP, one hour a week with the owner, the renewal list from BSTAR.').node);
    } else if (step === 'impact') {
      var I = D.impact;
      if (!I.metric && D.discipline === 'Manage' && D.lmc.kpi) I.metric = kpiName(D.lmc);
      if (!I.metric && D.how && D.how.measure) I.metric = short(D.how.measure, 60);
      main.append(el('span', { class: 'eyebrow' }, 'Impact'), el('h2', {}, 'What impact do we expect?'),
        el('p', { class: 'hint' }, 'Put a number on it so the check-back can measure it. Skip anything you cannot estimate yet.'));
      var gapBox = el('div', {});
      var drawGap = function () {
        gapBox.replaceChildren();
        var b = num(I.base), t = num(I.target);
        if (!isNaN(b) && !isNaN(t) && b !== t) gapBox.append(el('div', { class: 'banner' }, el('span', { class: 'lab' }, 'Gap to close'), el('strong', {}, (t > b ? '+' : '') + fmtNum(t - b, I.unit))));
      };
      var nf2 = function (label, key, ph) {
        var f = textField(label, I[key], function (v) { I[key] = v; saveDraft(); drawGap(); }, ph, 'input');
        f.control.setAttribute('inputmode', 'decimal');
        return f.node;
      };
      main.append(textField('Which number will move?', I.metric, function (v) { I.metric = v; saveDraft(); }, 'Example: PM contract renewal rate', 'input').node,
        chipField('Unit', IMPACT_UNITS, I.unit, function (v) { I.unit = v; saveDraft(); drawGap(); }),
        el('div', { class: 'two' }, nf2('Today', 'base', 'Example: 78'), nf2('Target', 'target', 'Example: 90')),
        gapBox,
        nf2('Expected dollar impact per year', 'dollars', 'Example: 45000'),
        el('p', { class: 'hint' }, 'Dollar impact is the yearly revenue gained, cost avoided or margin protected if this works. A rough number is better than none.'));
      drawGap();
    } else if (step === 'when') {
      main.append(el('span', { class: 'eyebrow' }, PH.When), el('h2', {}, 'When will you act?'), el('p', { class: 'hint' }, 'Pick one, then give it one first step and a date.'),
        chipGroup(VERDICTS, D.verdict, function (v) { D.verdict = v; saveDraft(); }, 'warnset'));
      main.append(chipField('How likely do you think this is to work?', PRED, D.predict, function (v) { D.predict = v; saveDraft(); }));
      addTool(main, 'pressure', D);
      main.append(textField('Your first step', D.action, function (v) { D.action = v; saveDraft(); }, DC.act, 'input').node);
      main.append(textField('Who owns it (optional)', D.owner, function (v) { D.owner = v; saveDraft(); }, 'Name or team', 'input').node);
      var did = gid('f'), cid = gid('f');
      var due = el('input', { type: 'date', id: did });
      var chk = el('input', { type: 'date', id: cid });
      due.value = D.due || ''; chk.value = D.check || '';
      due.addEventListener('change', function () {
        D.due = due.value;
        if (due.value && !D.check) { D.check = plusDays(due.value, 14); chk.value = D.check; }
        saveDraft();
      });
      chk.addEventListener('change', function () { D.check = chk.value; saveDraft(); });
      main.append(el('div', { class: 'two' },
        el('div', { class: 'field' }, el('label', { class: 'q', for: did }, 'Do it by'), due),
        el('div', { class: 'field' }, el('label', { class: 'q', for: cid }, 'Check back on'), chk)));
    }
    var h2 = main.querySelector('h2');
    var sb = h2 ? speakBtn(function () { var hint = main.querySelector('.hint'); return h2.textContent + '. ' + (hint ? hint.textContent : ''); }) : null;
    if (sb) h2.after(sb);
    app.append(main);

    function softMsg() {
      if (step === 'options' && !D.options.alt1.trim()) return 'Most weak decisions have no alternative.';
      if (step.charAt(0) === 'q') {
        var A = D.answers[+step.slice(1)];
        if (!(A.a || '').trim() && !A.pick) return 'No answer yet.';
        if (!A.conf) return 'How sure are you?';
        if (A.conf === CONF[2] && !(A.chal || '').trim()) return 'Who could verify this?';
      }
      if (step === 'control' && !D.control.mine.trim() && !D.control.influence.trim() && !D.control.outside.trim()) return 'Nothing sorted yet.';
      if (step === 'who' && !stakeholders(D).length) return 'No one named yet.';
      return '';
    }
    function valid() {
      if (step === 'kind') return D.discipline ? '' : 'Pick Lead, Manage or Coach.';
      if (step === 'why') return D.decision.trim() ? '' : 'Describe the decision first.';
      if (step === 'when') {
        if (!D.verdict) return 'Pick what you will do.';
        if (!HALT[D.verdict]) {
          if (!D.action.trim()) return 'Write one first step.';
          if (!D.due) return 'Choose a do-by date.';
          if (!D.check) return 'Choose a check-back date.';
        }
      }
      return '';
    }
    back.addEventListener('click', function () {
      if (flow.i === 0) { saveDraft(); renderToday(); return; }
      flow.i -= 1; saveDraft(); renderFlow(); window.scrollTo(0, 0);
    });
    next.addEventListener('click', function () {
      var msg = valid();
      if (msg) { toast(msg); return; }
      var sm = softMsg();
      if (sm && flow.nudged !== flow.i) { flow.nudged = flow.i; toast(sm + ' Tap Next again to skip.'); return; }
      if (flow.i === steps.length - 1) {
        if (D.verdict === 'Go' && !flow.gateOk && (unverified(D).length >= ((flow.quick ? 2 : 3) - ((D.reversible && D.reversible !== 'Easy to undo') ? 1 : 0)) || matrixMismatch(D))) { flow.gate = true; renderFlow(); window.scrollTo(0, 0); return; }
        finish(); return;
      }
      flow.i += 1; saveDraft(); renderFlow(); window.scrollTo(0, 0);
    });
    if (pausing) next.disabled = true;
    app.append(el('div', { class: 'flowbar' }, el('div', {}, back, next)));
  }

  function finish() {
    var D = flow.data, now = new Date(), t = function (x) { return ((x || '').trim()) || '(no answer)'; };
    var QL = qsFor(D);
    var qk = flow.quick;
    var lv = D.discipline === 'Manage' ? lmcLevel(D.lmc) : '';
    var tagLine = [D.brand, D.func, D.franchisee.trim()].filter(Boolean).join(' / ');
    var md = '# Decision: ' + D.decision.trim() + '\n' + D.discipline + (qk ? ' (quick check)' : '') + ' / ' + stamp(now) + (tagLine ? '\n' + tagLine : '') +
      (lv && D.lmc.kpi ? '\n\n## LMC scorecard\nKPI: ' + kpiName(D.lmc) + '\nStatus: ' + D.lmc.status + ' (last visit: ' + (D.lmc.prev || '-') + ')\nResponse level: ' + lv : '') + '\n\n## WHY\nWhy now: ' + t(D.why) + '\nIf we do nothing: ' + t(D.nowcost) + (D.whyKind ? '\nDriver: ' + D.whyKind : '') + (D.reversible ? '\nUndo: ' + D.reversible : '') + '\nOptions considered: ' + t(D.options.alt1) + (D.options.alt2.trim() ? '; ' + D.options.alt2.trim() : '') + '\nWhy this one: ' + t(D.options.why) + (D.lazy.path ? '\n\n## Laziness Theory\nLeast-effort path: ' + D.lazy.path + (lazyOn(D) ? '\nWhat it looks like: ' + t(D.lazy.how) + '\nSame result: ' + t(D.lazy.same) : '') : '') + '\n\n## Critical questions\n';
    D.answers.forEach(function (a, k) { if (qk && !(a.a || '').trim() && !a.pick) return; md += (k + 1) + '. ' + QL[k].t + ': ' + QL[k].q + '\n   ' + (a.pick ? '(' + a.pick + ') ' : '') + ((a.a || '').trim() ? a.a.trim() : (a.pick ? '' : '(no answer)')) + ' [' + (a.conf || 'not rated') + ']\n' + ((a.chal || '').trim() ? '   ' + (a.conf === CONF[2] ? 'To verify: ' : 'Would prove it wrong: ') + a.chal.trim() + '\n' : ''); });
    md += '\n## Who is affected\n';
    stakeholders(D).forEach(function (w) { md += '- ' + w.name.trim() + '\n  Decision: ' + t(w.dec) + '\n  Outcome: ' + t(w.out) + '\n'; });
    if (!qk) {
      md += '\n## In our control\nIn our control: ' + t(D.control.mine) + '\nCan influence: ' + t(D.control.influence) + '\nOutside our control: ' + t(D.control.outside);
      md += '\n\n## What we might not be considering\nIf it failed: ' + t(D.blind.fail) + '\nMissing: ' + t(D.blind.missing) + '\nDisagreement: ' + t(D.blind.oppose) + '\nCould change: ' + t(D.blind.change) + (RISKS[D.blind.risk] ? '\nBiggest risk: ' + D.blind.risk + '\n  ' + RISKS[D.blind.risk][0].q + ' ' + t(D.blind.r0) + '\n  ' + RISKS[D.blind.risk][1].q + ' ' + t(D.blind.r1) : '');
      md += '\n\n## HOW\nPlan: ' + t(D.how.plan) + '\nWorking if: ' + t(D.how.measure) + '\nNeeds: ' + t(D.how.needs);
    }
    var Im = D.impact || {};
    var hasImp = (Im.metric || '').trim() || (Im.dollars || '').trim();
    if (hasImp) md += '\n\n## IMPACT\nMetric: ' + t(Im.metric) + '\nToday: ' + t(Im.base) + '\nTarget: ' + t(Im.target) + (Im.unit ? ' (' + Im.unit + ')' : '') + '\nExpected per year: ' + (isNaN(num(Im.dollars)) ? '-' : money(num(Im.dollars)));
    md += '\n\n## WHEN\nVerdict: ' + D.verdict + '\nFirst step: ' + (D.action.trim() || '-') + '\nOwner: ' + (D.owner.trim() || '-') + '\nDo by: ' + (D.due || '-') + '\nCheck back: ' + (D.check || '-');
    state.records.unshift({
      id: uid(), discipline: D.discipline, brand: D.brand, func: D.func, franchisee: D.franchisee.trim(),
      lmc: lv && D.lmc.kpi ? { kpi: kpiName(D.lmc), status: D.lmc.status, prev: D.lmc.prev, multi: D.lmc.multi, level: lv } : null, title: short(D.decision, 80), stamp: stamp(now), md: md, why: D.why.trim(),
      who: stakeholders(D).map(function (w) { return { name: w.name.trim(), dec: w.dec.trim(), out: w.out.trim() }; }),
      matrix: matrixRecord(D), predict: D.predict ? parseInt(D.predict, 10) / 100 : null, ai: D.ai || {},
      ctx: { nowcost: D.nowcost.trim(), whyKind: D.whyKind, reversible: D.reversible, stoic: D.stoic || '' },
      control: qk ? null : { mine: D.control.mine.trim(), influence: D.control.influence.trim(), outside: D.control.outside.trim() },
      blind: qk ? null : { fail: D.blind.fail.trim(), missing: D.blind.missing.trim(), oppose: D.blind.oppose.trim(), change: D.blind.change.trim(), risk: RISKS[D.blind.risk] ? D.blind.risk : '', r0: (D.blind.r0 || '').trim(), r1: (D.blind.r1 || '').trim() },
      how: qk ? null : { plan: D.how.plan.trim(), measure: D.how.measure.trim(), needs: D.how.needs.trim() },
      impact: hasImp ? { metric: (Im.metric || '').trim(), unit: Im.unit || '', base: (Im.base || '').trim(), target: (Im.target || '').trim(), dollars: (Im.dollars || '').trim() } : null,
      lazy: D.lazy.path ? { path: D.lazy.path, how: (D.lazy.how || '').trim(), same: D.lazy.same || '' } : null,
      quick: !!qk, options: { alt1: D.options.alt1.trim(), alt2: D.options.alt2.trim(), why: D.options.why.trim() }, challenges: [],
      checks: D.answers.map(function (a, k) { return a.conf === CONF[2] && ((a.a || '').trim() || a.pick) ? { q: QL[k].q, t: (a.chal || '').trim(), done: false } : null; }).filter(Boolean),
      answers: D.answers.map(function (a, k) { return { q: QL[k].q, a: (a.a || '').trim(), pick: a.pick || '', conf: a.conf, chal: (a.chal || '').trim() }; }).filter(function (x) { return x.a || x.pick; }),
      decision: { verdict: D.verdict, action: D.action.trim(), owner: D.owner.trim(), due: D.due, check: D.check },
      actionDone: false, outcome: null
    });
    if (flow.jot) state.jots = state.jots.filter(function (j) { return j.id !== flow.jot; });
    state.draft = null;
    persist();
    renderToday();
    toast('Saved. Your first step is on the list.');
    window.scrollTo(0, 0);
  }

  load();
  renderToday();
  startShared();
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
