<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lead, Manage, Coach</title>
<meta name="description" content="A decision tool for franchise leaders: pick Lead, Manage or Coach, answer plain questions, then choose a next step.">
<meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LMC Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column. A Today screen lists decisions and next steps; "New decision" opens a one-question-per-screen guided flow. Each discipline owns a color: Lead is indigo, Manage is pine, Coach is berry. Amber is kept for the pause and anything due. */
:root {
  --bg: #F3F4F8;
  --surface: #FFFFFF;
  --field: #F7F8FB;
  --fg: #14213D;
  --muted: #5A6479;
  --line: #D8DCE8;
  --accent: #2B4C9B;
  --accent-fg: #FFFFFF;
  --accent-soft: #E3E9F8;
  --lead: #2B4C9B; --lead-soft: #E3E9F8;
  --manage: #1D7566; --manage-soft: #DDF0EB;
  --coach: #8E3B7A; --coach-soft: #F3E3EF;
  --warn: #9A4A06;
  --warn-soft: #F7E8D6;
  --crit: #B3261E;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1220; --surface: #151C30; --field: #10162A; --fg: #E8ECF6; --muted: #98A2BC;
    --line: #29324D; --accent: #8FA9F0; --accent-fg: #0B1630; --accent-soft: #1B2745;
    --lead: #8FA9F0; --lead-soft: #1B2745; --manage: #5CCBB7; --manage-soft: #14332D; --coach: #E39BD0; --coach-soft: #3A1B33;
    --warn: #EBA561; --warn-soft: #33261A; --crit: #F0877F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1220; --surface: #151C30; --field: #10162A; --fg: #E8ECF6; --muted: #98A2BC;
  --line: #29324D; --accent: #8FA9F0; --accent-fg: #0B1630; --accent-soft: #1B2745;
  --lead: #8FA9F0; --lead-soft: #1B2745; --manage: #5CCBB7; --manage-soft: #14332D; --coach: #E39BD0; --coach-soft: #3A1B33;
  --warn: #EBA561; --warn-soft: #33261A; --crit: #F0877F; color-scheme: dark;
}
[data-d="Lead"] { --dc: var(--lead); --ds: var(--lead-soft); }
[data-d="Manage"] { --dc: var(--manage); --ds: var(--manage-soft); }
[data-d="Coach"] { --dc: var(--coach); --ds: var(--coach-soft); }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 640px; margin-inline: auto; padding-inline: 16px; padding-block: 20px 120px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: 25px; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 60ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack.tight { gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
label, .lab { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
label.q { font-family: var(--body); font-size: 17px; letter-spacing: 0; text-transform: none; color: var(--fg); font-weight: 600; }
.hint { color: var(--muted); font-size: 15px; margin: 0; }
input[type="text"], input[type="date"], textarea {
  width: 100%; font: inherit; font-size: 17px; color: var(--fg); background: var(--field);
  border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; min-width: 0; min-height: 48px;
}
textarea { resize: vertical; min-height: 96px; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.75; }
input:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select { width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; min-height: 48px; }
.btn {
  font: inherit; font-weight: 600; font-size: 17px; min-height: 52px; padding: 0 20px; border-radius: 8px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { min-height: 42px; font-size: 15px; padding: 0 14px; }
.btn.danger { color: var(--crit); border-color: var(--line); background: transparent; }
.btn:disabled { opacity: 0.45; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions .btn { flex: 1 1 140px; }
.mono { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.banner { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.banner.warn { background: var(--warn-soft); }
.banner strong { font-family: var(--display); font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: block; text-transform: none; letter-spacing: 0; font-family: var(--body); font-size: 16px; color: var(--fg); }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.chip span { display: flex; align-items: center; min-height: 48px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); font-weight: 500; }
.chip input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips.col { flex-direction: column; }
.chips.col .chip span { min-height: 56px; }
.chips.warnset .chip input:checked + span { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 400px) { .two { grid-template-columns: 1fr; } }
.progress { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.progress .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); }
.progress .row { display: flex; justify-content: space-between; align-items: center; }
.linkbtn { font: inherit; font-size: 15px; background: none; border: 0; color: var(--accent); padding: 8px 0; min-height: 44px; cursor: pointer; font-weight: 600; }
.pause { align-items: center; text-align: center; padding-block: 36px; background: var(--warn-soft); border-color: var(--warn); }
.pause .count { font-family: var(--display); font-weight: 700; font-size: 100px; line-height: 1; color: var(--warn); font-variant-numeric: tabular-nums; }
.pause p { margin: 0; max-width: 32ch; }
.pause .bar { width: 100%; height: 6px; background: var(--surface); border-radius: 3px; overflow: hidden; }
.pause .bar i { display: block; height: 100%; width: 0; background: var(--warn); }
.flowbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.flowbar div { max-width: 640px; margin-inline: auto; display: flex; gap: 10px; }
.flowbar .btn { flex: 1; }
.flowbar .btn.ghost { flex: 0 0 auto; }
details.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 14px; }
details.entry summary { cursor: pointer; padding: 12px 0; display: flex; flex-direction: column; gap: 6px; list-style: none; min-height: 48px; }
details.entry summary::-webkit-details-marker { display: none; }
details.entry summary .t { font-weight: 600; overflow-wrap: anywhere; }
details.entry .body { display: flex; flex-direction: column; gap: 14px; padding-bottom: 14px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--field); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.hot { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.pill.live { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
dl.sum { margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 16px; }
dl.sum dt { font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding-top: 3px; }
dl.sum dd { margin: 0; overflow-wrap: anywhere; }
.next { font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.next b { color: var(--fg); font-weight: 600; }
pre { margin: 0; font-family: var(--mono); font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.empty { color: var(--muted); margin: 0; font-size: 16px; }
.example { border-style: dashed; }
.jot { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.jot .text { overflow-wrap: anywhere; white-space: pre-wrap; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.steps span { color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 15px; z-index: 20; max-width: calc(100% - 32px); }
.disc-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { font: inherit; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 10px; min-height: 92px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; min-width: 0; }
.tile[aria-pressed="true"] { background: var(--ds, var(--accent-soft)); border-color: var(--dc, var(--accent)); }
.tile .l { font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--dc, var(--accent)); }
.tile .s { font-size: 13px; color: var(--muted); line-height: 1.3; }
.tile .n { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: auto; padding-top: 4px; }
.mark { display: inline-grid; place-items: center; width: 22px; height: 22px; border: 1.5px solid var(--dc, var(--accent)); color: var(--dc, var(--accent)); background: var(--ds, transparent); font-family: var(--mono); font-weight: 500; font-size: 12px; border-radius: 3px; flex: none; }
.brand { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip.disc span { flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; }
.chip.disc input:checked + span { background: var(--ds); border-color: var(--dc); color: var(--dc); }
.chip.disc small { font-weight: 400; color: var(--muted); font-size: 14px; }
.rep-row { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); }
.rep-row .k { font-size: 14px; color: var(--muted); font-weight: 600; overflow-wrap: anywhere; }
.rep-row .v { white-space: pre-wrap; overflow-wrap: anywhere; }
@media print { body { background: #fff; color: #000; } .noprint, .toast { display: none !important; } .card { break-inside: avoid; border-color: #999; } .wrap { padding-block: 0; } }
@media (prefers-reduced-motion: no-preference) { .pause .bar i { transition: width 1s linear; } .progress .bar i { transition: width .25s ease; } }
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  var KEY = 'decision-desk-v2';
  var OLD = 'decision-desk-v1';
  var state = { records: [], jots: [], draft: null };
  var flow = null;
  var timer = null;
  var app = document.getElementById('app');

  /* ---------- Content ---------- */
  var TESTS = [
    { k: 'evidence', q: 'What have you actually seen or measured that backs this up?', ph: 'Example: Last quarter, 3 of 4 franchisees had open capacity.' },
    { k: 'history', q: 'How often has this held true in similar cases?', ph: 'Example: It held about half the time.' },
    { k: 'motive', q: 'Do you want this to be true? What do you gain if it is?', ph: 'Example: Yes. It makes the plan much simpler.' }
  ];
  var CHECK = ['Solid', 'Needs checking', 'Does not hold'];
  var WORRIES = {
    'We could not deliver': [
      { k: 'a0', q: 'What one person, supplier or process, if it fails, stops everything?' },
      { k: 'a1', q: 'What is your backup, and has anyone ever tried it?' }
    ],
    'Competitors cut prices': [
      { k: 'a0', q: 'At what price cut do we stop making money?' },
      { k: 'a1', q: 'What do we offer that a competitor cannot easily copy?' }
    ],
    'People did not adopt it': [
      { k: 'a0', q: 'What will people have to stop doing for this to work?' },
      { k: 'a1', q: 'Who will resist, and what do they lose?' }
    ],
    'The economy shifted': [
      { k: 'a0', q: 'Which cost or customer demand would hurt most if it moved 20%?' },
      { k: 'a1', q: 'What could you pause quickly if money tightened?' }
    ]
  };
  var DISC = {
    'Lead': { m: 'L', line: 'Set direction', desc: 'Where are we going, and why?', ph: 'Example: Should we offer shared leads to franchisees in two more territories?', act: 'Example: Share the new direction with every franchisee on the next call.' },
    'Manage': { m: 'M', line: 'Run the results', desc: 'Numbers, KPIs, systems and variances.', ph: 'Example: Should we change how service calls are dispatched at the weak locations?', act: 'Example: Pull the latest variance report and review it by Friday.' },
    'Coach': { m: 'C', line: 'Develop a person', desc: 'Their growth, performance or a hard conversation.', ph: 'Example: Should I move a strong technician into a lead role?', act: 'Example: Hold a 30-minute feedback conversation this week.' }
  };
  var filterDisc = '';
  var VERDICTS = ['Go', 'Test first', 'Wait', 'Stop'];
  var HALT = { 'Wait': 1, 'Stop': 1 };

  /* ---------- Storage ---------- */
  function load() {
    var got = false;
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && typeof o === 'object') {
          if (Array.isArray(o.records)) state.records = o.records;
          if (Array.isArray(o.jots)) state.jots = o.jots;
          if (o.draft) state.draft = o.draft;
          got = true;
        }
      }
    } catch (e) {}
    if (got) return;
    try {
      var old = localStorage.getItem(OLD);
      if (!old) return;
      var p = JSON.parse(old);
      var map = { 'Proceed': 'Go', 'Test first': 'Test first', 'Pause': 'Wait', 'Stop': 'Stop' };
      (p.records || []).forEach(function (r) {
        if (!r || !r.decision) return;
        var d = r.decision;
        state.records.push({ id: r.id, title: r.title, stamp: r.stamp, md: r.md, assumptions: [], worry: '',
          decision: { verdict: map[d.verdict] || d.verdict || 'Go', action: d.action || '', owner: d.owner || '', due: d.due || '', check: d.reviewOn || '' },
          actionDone: !!r.actionDone, outcome: r.outcome || null });
      });
      (p.captures || []).forEach(function (c) { if (c && !c.done) state.jots.push({ id: c.id, text: c.text, stamp: c.stamp }); });
    } catch (e) {}
  }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  /* ---------- Helpers ---------- */
  function el(tag, attrs) {
    var n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'class') n.className = attrs[k]; else n.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) if (arguments[i] != null) n.append(arguments[i]);
    return n;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function stamp(d) { return dkey(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function short(s, n) { s = (s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 3) + '...' : s; }
  function plusDays(iso, n) {
    var p = iso.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2] + n);
    return dkey(d);
  }
  var seq = 0;
  function gid(p) { seq += 1; return p + seq; }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }
  function copyText(text, btn, source) {
    var label = btn.textContent;
    function done(m) { btn.textContent = m; setTimeout(function () { btn.textContent = label; }, 1600); }
    function fb() {
      if (source) {
        var r = document.createRange(); r.selectNodeContents(source);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        done('Selected, tap Copy');
      } else done('Copy not available');
    }
    try { navigator.clipboard.writeText(text).then(function () { done('Copied'); }, fb); } catch (e) { fb(); }
  }
  function addToCalendar(r, btn) {
    var d = r.decision || {}, day = d.check.replace(/-/g, '');
    var end = plusDays(d.check, 1).replace(/-/g, '');
    var esc = function (x) { return String(x || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); };
    var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Lead Manage Coach//EN', 'BEGIN:VEVENT', 'UID:' + r.id + '@lmc',
      'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', 'DTSTART;VALUE=DATE:' + day, 'DTEND;VALUE=DATE:' + end,
      'SUMMARY:' + esc('Check back: ' + r.title),
      'DESCRIPTION:' + esc('First step: ' + (d.action || '-') + '\nOwner: ' + (d.owner || '-') + '\nDid it work as expected? Log the result in Lead, Manage, Coach.'),
      'BEGIN:VALARM', 'TRIGGER:PT9H', 'ACTION:DISPLAY', 'DESCRIPTION:Decision check-back', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    var label = btn.textContent;
    function note(m) { btn.textContent = m; setTimeout(function () { btn.textContent = label; }, 2200); }
    try {
      var f = new File([ics], 'check-back.ics', { type: 'text/calendar' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f] }).catch(function () {}); return; }
    } catch (e) {}
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
      a.download = 'check-back.ics';
      document.body.appendChild(a); a.click(); a.remove();
      note('Open the file to add it');
    } catch (e) { note('Not available here'); }
  }
  function armDelete(btn, fn) {
    var armed = false, t;
    btn.addEventListener('click', function () {
      if (!armed) { armed = true; btn.textContent = 'Tap again to delete'; t = setTimeout(function () { armed = false; btn.textContent = 'Delete'; }, 3000); }
      else { clearTimeout(t); fn(); }
    });
  }
  function chipGroup(opts, current, onPick, cls) {
    var name = gid('g');
    var wrap = el('div', { class: 'chips ' + (cls || ''), role: 'radiogroup' });
    opts.forEach(function (o, i) {
      var input = el('input', { type: 'radio', name: name, id: name + '-' + i, value: o });
      if (o === current) input.checked = true;
      input.addEventListener('change', function () { onPick(o); });
      wrap.append(el('label', { class: 'chip', for: name + '-' + i }, input, el('span', {}, o)));
    });
    return wrap;
  }
  function textField(label, value, onInput, ph, kind) {
    var id = gid('f');
    var c = kind === 'input' ? el('input', { type: 'text', id: id }) : el('textarea', { id: id });
    if (ph) c.setAttribute('placeholder', ph);
    c.value = value || '';
    c.addEventListener('input', function () { onInput(c.value); });
    return { node: el('div', { class: 'field' }, el('label', { class: 'q', for: id }, label), c), control: c };
  }

  /* ---------- Status ---------- */
  function status(r) {
    var today = dkey(new Date());
    var d = r.decision || {};
    if (r.outcome) return { label: 'Reviewed', cls: '', rank: 4 };
    var live = !HALT[d.verdict];

    } else if (step === 'when') {
      main.append(el('span', { class: 'eyebrow' }, PH.When), el('h2', {}, 'When will you act?'), el('p', { class: 'hint' }, 'Pick one, then give it one first step and a date.'),
        chipGroup(VERDICTS, D.verdict, function (v) { D.verdict = v; saveDraft(); }, 'warnset'));
      main.append(textField('Your first step', D.action, function (v) { D.action = v; saveDraft(); }, DC.act, 'input').node);
      main.append(textField('Who owns it (optional)', D.owner, function (v) { D.owner = v; saveDraft(); }, 'Name or team', 'input').node);
      var did = gid('f'), cid = gid('f');
      var due = el('input', { type: 'date', id: did });
      var chk = el('input', { type: 'date', id: cid });
      due.value = D.due || ''; chk.value = D.check || '';
      due.addEventListener('change', function () {
        D.due = due.value;
        if (due.value && !D.check) { D.check = plusDays(due.value, 14); chk.value = D.check; }
        saveDraft();
      });
      chk.addEventListener('change', function () { D.check = chk.value; saveDraft(); });
      main.append(el('div', { class: 'two' },
        el('div', { class: 'field' }, el('label', { class: 'q', for: did }, 'Do it by'), due),
        el('div', { class: 'field' }, el('label', { class: 'q', for: cid }, 'Check back on'), chk)));
    }
    var h2 = main.querySelector('h2');
    var sb = h2 ? speakBtn(function () { var hint = main.querySelector('.hint'); return h2.textContent + '. ' + (hint ? hint.textContent : ''); }) : null;
    if (sb) h2.after(sb);
    app.append(main);

    function softMsg() {
      if (step === 'options' && !D.options.alt1.trim()) return 'Most weak decisions have no alternative.';
      if (step.charAt(0) === 'q') {
        var A = D.answers[+step.slice(1)];
        if (!(A.a || '').trim() && !A.pick) return 'No answer yet.';
        if (!A.conf) return 'How sure are you?';
        if (A.conf === CONF[2] && !(A.chal || '').trim()) return 'Who could verify this?';
      }
      if (step === 'control' && !D.control.mine.trim() && !D.control.influence.trim() && !D.control.outside.trim()) return 'Nothing sorted yet.';
      if (step === 'who' && !stakeholders(D).length) return 'No one named yet.';
      return '';
    }
    function valid() {
      if (step === 'kind') return D.discipline ? '' : 'Pick Lead, Manage or Coach.';
      if (step === 'why') return D.decision.trim() ? '' : 'Describe the decision first.';
      if (step === 'when') {
        if (!D.verdict) return 'Pick what you will do.';
        if (!HALT[D.verdict]) {
          if (!D.action.trim()) return 'Write one first step.';
          if (!D.due) return 'Choose a do-by date.';
          if (!D.check) return 'Choose a check-back date.';
        }
      }
      return '';
    }
    back.addEventListener('click', function () {
      if (flow.i === 0) { saveDraft(); renderToday(); return; }
      flow.i -= 1; saveDraft(); renderFlow(); window.scrollTo(0, 0);
    });
    next.addEventListener('click', function () {
      var msg = valid();
      if (msg) { toast(msg); return; }
      var sm = softMsg();
      if (sm && flow.nudged !== flow.i) { flow.nudged = flow.i; toast(sm + ' Tap Next again to skip.'); return; }
      if (flow.i === steps.length - 1) {
        if (D.verdict === 'Go' && !flow.gateOk && unverified(D).length >= ((flow.quick ? 2 : 3) - ((D.reversible && D.reversible !== 'Easy to undo') ? 1 : 0))) { flow.gate = true; renderFlow(); window.scrollTo(0, 0); return; }
        finish(); return;
      }
      flow.i += 1; saveDraft(); renderFlow(); window.scrollTo(0, 0);
    });
    if (pausing) next.disabled = true;
    app.append(el('div', { class: 'flowbar' }, el('div', {}, back, next)));
  }

  function finish() {
    var D = flow.data, now = new Date(), t = function (x) { return ((x || '').trim()) || '(no answer)'; };
    var QL = qsFor(D);
    var qk = flow.quick;
    var md = '# Decision: ' + D.decision.trim() + '\n' + D.discipline + (qk ? ' (quick check)' : '') + ' / ' + stamp(now) + '\n\n## WHY\nWhy now: ' + t(D.why) + '\nIf we do nothing: ' + t(D.nowcost) + (D.whyKind ? '\nDriver: ' + D.whyKind : '') + (D.reversible ? '\nUndo: ' + D.reversible : '') + '\nOptions considered: ' + t(D.options.alt1) + (D.options.alt2.trim() ? '; ' + D.options.alt2.trim() : '') + '\nWhy this one: ' + t(D.options.why) + '\n\n## Critical questions\n';
    D.answers.forEach(function (a, k) { if (qk && !(a.a || '').trim() && !a.pick) return; md += (k + 1) + '. ' + QL[k].t + ': ' + QL[k].q + '\n   ' + (a.pick ? '(' + a.pick + ') ' : '') + ((a.a || '').trim() ? a.a.trim() : (a.pick ? '' : '(no answer)')) + ' [' + (a.conf || 'not rated') + ']\n' + ((a.chal || '').trim() ? '   ' + (a.conf === CONF[2] ? 'To verify: ' : 'Would prove it wrong: ') + a.chal.trim() + '\n' : ''); });
    md += '\n## Who is affected\n';
    stakeholders(D).forEach(function (w) { md += '- ' + w.name.trim() + '\n  Decision: ' + t(w.dec) + '\n  Outcome: ' + t(w.out) + '\n'; });
    if (!qk) {
      md += '\n## In our control\nIn our control: ' + t(D.control.mine) + '\nCan influence: ' + t(D.control.influence) + '\nOutside our control: ' + t(D.control.outside);
      md += '\n\n## What we might not be considering\nIf it failed: ' + t(D.blind.fail) + '\nMissing: ' + t(D.blind.missing) + '\nDisagreement: ' + t(D.blind.oppose) + '\nCould change: ' + t(D.blind.change);
      md += '\n\n## HOW\nPlan: ' + t(D.how.plan) + '\nWorking if: ' + t(D.how.measure) + '\nNeeds: ' + t(D.how.needs);
    }
    md += '\n\n## WHEN\nVerdict: ' + D.verdict + '\nFirst step: ' + (D.action.trim() || '-') + '\nOwner: ' + (D.owner.trim() || '-') + '\nDo by: ' + (D.due || '-') + '\nCheck back: ' + (D.check || '-');
    state.records.unshift({
      id: uid(), discipline: D.discipline, title: short(D.decision, 80), stamp: stamp(now), md: md, why: D.why.trim(),
      who: stakeholders(D).map(function (w) { return { name: w.name.trim(), dec: w.dec.trim(), out: w.out.trim() }; }),
      ctx: { nowcost: D.nowcost.trim(), whyKind: D.whyKind, reversible: D.reversible, stoic: D.stoic || '' },
      control: qk ? null : { mine: D.control.mine.trim(), influence: D.control.influence.trim(), outside: D.control.outside.trim() },
      blind: qk ? null : { fail: D.blind.fail.trim(), missing: D.blind.missing.trim(), oppose: D.blind.oppose.trim(), change: D.blind.change.trim() },
      how: qk ? null : { plan: D.how.plan.trim(), measure: D.how.measure.trim(), needs: D.how.needs.trim() },
      quick: !!qk, options: { alt1: D.options.alt1.trim(), alt2: D.options.alt2.trim(), why: D.options.why.trim() }, challenges: [],
      checks: D.answers.map(function (a, k) { return a.conf === CONF[2] && ((a.a || '').trim() || a.pick) ? { q: QL[k].q, t: (a.chal || '').trim(), done: false } : null; }).filter(Boolean),
      answers: D.answers.map(function (a, k) { return { q: QL[k].q, a: (a.a || '').trim(), pick: a.pick || '', conf: a.conf, chal: (a.chal || '').trim() }; }).filter(function (x) { return x.a || x.pick; }),
      decision: { verdict: D.verdict, action: D.action.trim(), owner: D.owner.trim(), due: D.due, check: D.check },
      actionDone: false, outcome: null
    });
    if (flow.jot) state.jots = state.jots.filter(function (j) { return j.id !== flow.jot; });
    state.draft = null;
    persist();
    renderToday();
    toast('Saved. Your first step is on the list.');
    window.scrollTo(0, 0);
  }

  load();
  renderToday();
})();
</script>
